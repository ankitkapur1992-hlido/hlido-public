name: methodology-leak-guard

# Defensive guard for Hlido's IP moat:
# fail any change that exposes scoring weights, the Laddoo formula, or
# rubric internals on public-facing surfaces.
#
# See feedback_methodology_private.md and feedback_huggingface_disclosure.md.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
    # Path filter added 2026-06-07: this guard ONLY scans public surfaces
    # (scripts/check-methodology-leak.sh scans site/** + agents.json + llms.txt
    # + agent-manifest.json; it does NOT scan brain/**). Running it on the 100+
    # daily routine/bot commits to brain/** was ~3,000 GHA min/mo of pure waste
    # with zero security value. It now fires only when a public surface that
    # could actually leak methodology changes — full protection, ~95% fewer runs.
    paths:
      - "site/**"
      - "!site/internal/**"   # local-only command center; guard excludes it from scanning anyway
      - "agents.json"
      - "llms.txt"
      - "agent-manifest.json"

permissions:
  contents: read

jobs:
  methodology-leak-guard:
    name: methodology-leak-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run methodology-leak guard
        run: |
          chmod +x scripts/check-methodology-leak.sh
          bash scripts/check-methodology-leak.sh

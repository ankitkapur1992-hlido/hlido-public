name: methodology-leak-guard

# Defensive guard for Hlido's IP moat:
# fail any change that exposes scoring weights, the Laddoo formula, or
# rubric internals on public-facing surfaces.
#
# See feedback_methodology_private.md and feedback_huggingface_disclosure.md.

on:
  # THE GATE. A PR is the only place this guard can actually PREVENT a leak, so
  # it stays per-event here and is the coverage that matters.
  pull_request:
    branches: ["**"]

  # THE SWEEP (replaced the `push: main` trigger 2026-07-26). Scans the full live
  # tree once a day.
  #
  # Why the push trigger had to go — the 2026-06-07 fix, one layer down. That fix
  # narrowed this guard from every brain/** commit (~3,000 min/mo) to `site/**`,
  # which was correct but incomplete: the publish machinery rewrites
  # site/data/scorecards/** and site/data/attestations/** all day (939 + 628
  # file-touches on 2026-07-26 alone, across ~100+ commits/day to main), so
  # `site/**` IS the hot path. Measured result: ~30 runs/day, each finishing in
  # 2-11s (median 3s) — and GitHub bills every job rounded UP to a full minute.
  # That is ~900 min/mo of the 2,000-min free tier spent on ~90 seconds of real
  # work, and it is what exhausted the tier in July 2026.
  #
  # Protection is NOT reduced. A `push: main` run fires AFTER the push has landed
  # and after Pages has begun deploying, and this workflow is not a required
  # status check — so on main it was already detect-after-the-fact, never a block.
  # A daily full-tree sweep detects exactly the same class of leak on exactly the
  # same surfaces, 1 run/day instead of 30. The PR gate above is what blocks.
  schedule:
    - cron: "0 3 * * *"     # daily 03:00 UTC — quiet hour, before the founder's day
  workflow_dispatch:        # on-demand sweep (use after any manual site/** edit)

permissions:
  contents: read

# A publish burst commits many times in a row; without this each commit spawned
# its own separately-billed run. Harmless to cancel a superseded sweep — the next
# one scans the newer tree anyway.
concurrency:
  group: methodology-leak-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  methodology-leak-guard:
    name: methodology-leak-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run methodology-leak guard
        run: |
          chmod +x scripts/check-methodology-leak.sh
          bash scripts/check-methodology-leak.sh

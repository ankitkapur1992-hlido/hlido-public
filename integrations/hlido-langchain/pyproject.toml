[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hlido-langchain"
version = "0.1.0"
description = "LangChain tools for Hlido — vet an AI agent against its independent, evidence-backed trust score before delegating to it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hlido", email = "hello@hlido.eu" }]
keywords = ["ai", "agents", "trust", "langchain", "evaluation", "reliability", "hlido"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["hlido-trust[langchain]>=0.1.0"]

[project.urls]
Homepage = "https://hlido.eu"
Documentation = "https://hlido.eu/api/"
Source = "https://github.com/ankitkapur1992-hlido/hlido-public/tree/main/integrations/hlido-langchain"
Issues = "https://github.com/ankitkapur1992-hlido/hlido-public/issues"

[tool.setuptools.packages.find]
where = ["src"]

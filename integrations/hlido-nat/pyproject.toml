[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The repo-root .gitignore has a broad legacy `plugins/` rule that matches this
# package's `src/nat/plugins/` namespace path. Select files from the filesystem
# via the explicit include directives below instead of from VCS state.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/nat"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[project]
name = "hlido-nat"
version = "0.1.1"
requires-python = ">=3.11,<3.14"
description = "Hlido independent agent-trust integration for NVIDIA NeMo Agent Toolkit"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Hlido", email = "ankit@hlido.eu" }]
keywords = ["nvidia", "nemo", "agent", "trust", "evaluation", "hlido", "mcp"]
dependencies = [
  "nvidia-nat-core>=1.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "nvidia-nat-test>=1.8",
]

[project.urls]
Homepage = "https://hlido.eu"
Documentation = "https://hlido.eu/mcp"
Source = "https://github.com/ankitkapur1992-hlido/hlido-public/tree/main/integrations/hlido-nat"

[project.entry-points."nat.plugins"]
nat_hlido = "nat.plugins.hlido.register"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hlido"
version = "0.2.0"
description = "Hlido — independent, evidence-backed trust scores for AI agents. One package: `pip install hlido` for the core, plus framework extras hlido[nemo|langchain|crewai]."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Hlido", email = "hello@hlido.eu" }]
keywords = ["ai", "agents", "trust", "evaluation", "reliability", "crewai", "langchain", "hlido", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Umbrella: installing `hlido` pulls the focused trust tool. As Hlido's Python
# surface grows, the full SDK lives under this same `hlido` namespace.
dependencies = ["hlido-trust>=0.2.0"]

[project.optional-dependencies]
crewai = ["hlido-trust[crewai]>=0.2.0"]
langchain = ["hlido-trust[langchain]>=0.2.0"]
nemo = ["hlido-trust[nemo]>=0.2.0"]

[project.urls]
Homepage = "https://hlido.eu"
Documentation = "https://hlido.eu/api/"
Source = "https://github.com/ankitkapur1992-hlido/hlido-public/tree/main/integrations/hlido"
Issues = "https://github.com/ankitkapur1992-hlido/hlido-public/issues"

[tool.setuptools.packages.find]
where = ["src"]
